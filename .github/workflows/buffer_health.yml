# .github/workflows/buffer_health.yml
# Daily health check — query Buffer GraphQL for past-24h posts, alert Slack if any failed.
# NOTE: uses api.buffer.com (Buffer v2 GraphQL) with Bearer token auth.
# api.buffer.com schema uses input objects; Channel type has no posts field —
# posts are queried top-level filtered by channelIds + dueAt range.

name: Buffer Health Check

on:
  schedule:
    # 22:00 UTC daily (17:00 Bogota)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Run health check
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          BUFFER_CHANNEL_IDS:  ${{ secrets.BUFFER_CHANNEL_IDS }}  # comma-separated channel ids
        run: |
          node <<'JS'
          const channelIds = (process.env.BUFFER_CHANNEL_IDS || '').split(',').filter(Boolean);
          const slack      = process.env.SLACK_WEBHOOK_URL;
          const token      = process.env.BUFFER_ACCESS_TOKEN;
          const now        = new Date().toISOString();
          const since      = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
          const GQL        = 'https://api.buffer.com';

          const gql = async (query, variables) => {
            const r = await fetch(GQL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-buffer-client-id': 'webapp-publish',
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
              },
              body: JSON.stringify({ query, variables }),
            });
            return r.json();
          };

          // Get org ID dynamically
          const accountRes = await gql('{ account { currentOrganization { id } } }');
          const orgId = accountRes?.data?.account?.currentOrganization?.id;
          if (!orgId) {
            console.error('Failed to get org ID', JSON.stringify(accountRes).slice(0, 300));
            process.exit(1);
          }

          const Q = `query Posts($after: String) {
            posts(
              input: {
                organizationId: "${orgId}",
                filter: {
                  channelIds: ${JSON.stringify(channelIds)},
                  dueAt: { start: "${since}", end: "${now}" }
                }
              }
              first: 50
              after: $after
            ) {
              edges { node { id status dueAt text } }
              pageInfo { hasNextPage endCursor }
            }
          }`;

          const failed = [];
          let cursor = null;
          let hasMore = true;

          while (hasMore) {
            const r = await gql(Q, { after: cursor });
            const conn = r?.data?.posts;
            if (!conn) { console.warn('No post data', JSON.stringify(r).slice(0, 300)); break; }
            for (const { node } of (conn.edges || [])) {
              if (node.status !== 'sent') {
                failed.push({ id: node.id, status: node.status, dueAt: node.dueAt, text: (node.text || '').slice(0, 80) });
              }
            }
            hasMore = conn.pageInfo?.hasNextPage;
            cursor  = conn.pageInfo?.endCursor;
          }

          if (failed.length === 0) {
            console.log('All clear — all posts published cleanly in the last 24h.');
            process.exit(0);
          }

          console.log('FAILED:', JSON.stringify(failed, null, 2));
          if (slack) {
            const text = `⚠ CLP26 Buffer health: ${failed.length} post(s) did not send in last 24h.\n` +
                         failed.map(f => `• ${f.id} (${f.status}): ${f.text}`).join('\n');
            await fetch(slack, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text }),
            });
          }
          process.exitCode = 1;
          JS
