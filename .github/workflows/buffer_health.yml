# .github/workflows/buffer_health.yml
# CleantechHUB — Buffer daily health check
# Queries Buffer for posts due in the past 24h that did NOT send (stuck or errored).
# Alerts to Slack on any failure. Runs daily at 22:00 UTC (17:00 Bogotá).
#
# Required repo secrets:
#   BUFFER_ACCESS_TOKEN  — Buffer direct access token
#   BUFFER_CHANNEL_IDS   — comma-separated channel IDs (LI, IG, FB per country)
#   SLACK_WEBHOOK_URL    — Slack incoming webhook URL
#
# Auth: api.buffer.com/graphql with Bearer token.
# Fixed 2026-04-29: previous version queried posts(status:sent) then checked status!='sent'
#   — logical impossibility that always returned 0 failures and never alerted.
#   Now queries posts(status:scheduled) past dueAt (stuck) + posts(status:error) (failed).

name: Buffer Health Check

on:
  schedule:
    # 22:00 UTC daily (17:00 Bogotá / 15:00 Lima / 16:00 San José)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Run health check
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          BUFFER_CHANNEL_IDS:  ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: |
          node <<'JS'
          const channelIds = (process.env.BUFFER_CHANNEL_IDS || '').split(',').map(s => s.trim()).filter(Boolean);
          const slack      = process.env.SLACK_WEBHOOK_URL;
          const token      = process.env.BUFFER_ACCESS_TOKEN;
          const GQL        = 'https://api.buffer.com/graphql';
          const now        = Date.now();
          const since      = new Date(now - 24 * 3600 * 1000).toISOString();

          if (!token)      { console.error('BUFFER_ACCESS_TOKEN not set'); process.exit(1); }
          if (!channelIds.length) { console.error('BUFFER_CHANNEL_IDS not set'); process.exit(1); }

          const gql = async (query, variables) => {
            const r = await fetch(GQL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
              },
              body: JSON.stringify({ query, variables }),
            });
            if (!r.ok) throw new Error(`Buffer API HTTP ${r.status}`);
            return r.json();
          };

          // Query 1: scheduled posts still in queue with dueAt in the past — these are STUCK.
          const Q_SCHEDULED = `query ScheduledPosts($channelId: String!) {
            channel(id: $channelId) {
              posts(status: scheduled, first: 100) {
                edges { node { id status dueAt text } }
              }
            }
          }`;

          // Query 2: explicitly errored posts in the last 24h — these FAILED.
          const Q_ERROR = `query ErrorPosts($channelId: String!) {
            channel(id: $channelId) {
              posts(status: error, first: 50) {
                edges { node { id status dueAt text } }
              }
            }
          }`;

          const failed = [];

          for (const chId of channelIds) {
            let data;

            // --- Stuck posts (scheduled but past dueAt) ---
            try {
              data = await gql(Q_SCHEDULED, { channelId: chId });
              const edges = data?.data?.channel?.posts?.edges || [];
              for (const { node } of edges) {
                if (node.dueAt && node.dueAt < new Date().toISOString()) {
                  // Only flag if dueAt is within the last 24h (not ancient backlog)
                  if (node.dueAt > since) {
                    failed.push({
                      channel: chId,
                      id: node.id,
                      status: 'stuck-scheduled',
                      dueAt: node.dueAt,
                      text: (node.text || '').slice(0, 80),
                    });
                  }
                }
              }
            } catch (e) {
              console.warn(`[${chId}] scheduled query failed: ${e.message}`);
            }

            // --- Errored posts (past 24h) ---
            try {
              data = await gql(Q_ERROR, { channelId: chId });
              const edges = data?.data?.channel?.posts?.edges || [];
              for (const { node } of edges) {
                if (node.dueAt && node.dueAt > since) {
                  failed.push({
                    channel: chId,
                    id: node.id,
                    status: 'error',
                    dueAt: node.dueAt,
                    text: (node.text || '').slice(0, 80),
                  });
                }
              }
            } catch (e) {
              console.warn(`[${chId}] error query failed: ${e.message}`);
            }
          }

          if (failed.length === 0) {
            console.log(`✅ All clear — no stuck or failed posts in the last 24h across ${channelIds.length} channel(s).`);
            process.exit(0);
          }

          console.log(`❌ FAILED POSTS (${failed.length}):`);
          console.log(JSON.stringify(failed, null, 2));

          if (slack) {
            const lines = failed.map(f =>
              `• [${f.status}] ch=${f.channel} id=${f.id} dueAt=${f.dueAt}\n  "${f.text}"`
            );
            const text = `⚠️ CleantechHUB Buffer health: ${failed.length} post(s) did not publish.\n${lines.join('\n')}`;
            await fetch(slack, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text }),
            });
            console.log('Slack alert sent.');
          } else {
            console.warn('SLACK_WEBHOOK_URL not set — no alert sent.');
          }

          process.exitCode = 1;
          JS
